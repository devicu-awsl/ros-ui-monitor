# Auto-release: on every push to main, build the Windows executable with
# PyInstaller and publish it as a GitHub Release.
#
# Versioning scheme: vX.Y
#   X = phase number, read from the PHASE file in the repo root
#       (Phase A -> 1; edit the file to 2 when Phase B starts and the next
#       release will be v2.1 automatically)
#   Y = auto-incremented per release within the phase, starting at 1
#       (first Phase A release is v1.1, then v1.2, v1.3, ...)
#
# The release tag and title are both vX.Y and the attached executable is
# named ros-ui-monitor_vX_Y.exe.

name: Build and Release Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PHASE="$(tr -d '[:space:]' < PHASE)"
          git fetch --tags --force
          LATEST_Y="$(git tag -l "v${PHASE}.*" | sed -n "s/^v${PHASE}\.\([0-9]\+\)$/\1/p" | sort -n | tail -1)"
          if [ -z "$LATEST_Y" ]; then
            Y=1
          else
            Y=$((LATEST_Y + 1))
          fi
          VERSION="v${PHASE}.${Y}"
          EXE_NAME="ros-ui-monitor_v${PHASE}_${Y}.exe"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "exe_name=${EXE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${VERSION} (${EXE_NAME})"

      - name: Build executable with PyInstaller
        run: pyinstaller rb5009-monitor.spec --clean --noconfirm

      - name: Rename executable
        shell: bash
        run: mv "dist/rb5009-monitor.exe" "dist/${{ steps.version.outputs.exe_name }}"

      - name: Smoke-test executable
        shell: bash
        run: '"dist/${{ steps.version.outputs.exe_name }}" --version'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/${{ steps.version.outputs.exe_name }}
          generate_release_notes: true
