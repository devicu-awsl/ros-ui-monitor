[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rb5009-monitor"
version = "2.1.0"
description = "LAN-only monitoring dashboard for a MikroTik RB5009 (RouterOS REST API)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Phase A/B only: the dashboard is plain static HTML served by FastAPI, so no
# template engine is needed and the PyInstaller bundle stays small.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional: the --chooser launcher window. Left out of the default install
# because Qt adds roughly 40-70 MB to a PyInstaller bundle.
gui = [
    "PySide6>=6.7",
    "segno>=1.6",   # pure-Python QR encoder, no dependencies of its own
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.10",
]

[project.scripts]
rb5009-monitor = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
